[project]
name = "ctx-distillery-eval"
version = "0.1.0"
description = "Offline, reward-free evaluation harness for ctx-distillery — score an assembled distillation plan (with its transcript excerpts) against the ATLAS 4-category (TF/TA/TG/PA, 0-10) LLM-as-judge and render a terminal scorecard. A one-way reader; never a reward."
requires-python = ">=3.11"
dependencies = ["ctx-distillery"]

[project.optional-dependencies]
judge = ["openai>=1.0"]
dev = ["pytest>=8"]

[tool.uv.sources]
ctx-distillery = { workspace = true }

[project.scripts]
ctx-distillery-eval = "ctx_distillery_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctx_distillery_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
