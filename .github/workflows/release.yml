name: Release

# Publish to PyPI via Trusted Publishing (OIDC) — NO API token. This file is INERT until a GitHub
# Release is published. Both one-time setup steps are DONE:
#   1. PyPI Trusted Publisher for project `ctx-distillery`
#        (owner = qazbnm456, repo = ctx-distillery, workflow = release.yml, environment = pypi).
#   2. A `pypi` environment in this repo's settings, restricted to `v*` TAGS.
# Publishing a GitHub Release (from a `vX.Y.Z` tag) now builds + uploads automatically.
#
# **The environment gate here is WEAKER than the sibling's, and not by choice.** `rlm-harness`'s
# `pypi` environment carries a `required_reviewers` rule, so every publish pauses for a human — the
# same posture this project takes everywhere else about irreversible actions. GitHub refuses that
# rule on a PRIVATE repository without a paid plan (422, "Please ensure the billing plan supports the
# required reviewers protection rule"); `rlm-harness` can have it because it is public. What this
# environment has instead is a deployment policy admitting only `v*` tags, which is a free feature.
# **When this repository goes public, add the reviewer rule to match the sibling.**
#
# One honest caveat about that tag policy: it has NOT been exercised end to end, because doing so
# means cutting a real release. If the ref a `release: published` run reports does not match `v*`,
# the publish job is BLOCKED, not broken — a visible, re-runnable failure (and repo admins can
# bypass), which is the right direction to fail for something that cannot be undone.
#
# Adding this file does NOT cut a version. `CHANGELOG.md` still has `## [Unreleased]` as its only
# heading, and `CLAUDE.md ## Versioning` is explicit that cutting one is the owner's statement that
# the software is usable — never a side effect of tooling landing. Nothing here runs until a human
# publishes a Release.
#
# Adapted from the sibling `rlm-harness` workflow, with two changes this repository needs:
#
#   * **The version guard below.** A published version number can never be reused on PyPI, so a tag
#     that disagrees with `pyproject.toml` is unrecoverable — it ships `ctx-distillery 0.1.0` under
#     a `v0.2.0` tag, or claims a version the code does not. `tests/test_public_api.py` already pins
#     `ctx_distillery.__version__` to `pyproject.toml`, so checking the tag against pyproject covers
#     both. The sibling has no equivalent; it is added here rather than omitted for symmetry.
#   * **A note on the workspace.** This repo is a `uv` workspace with two members (`eval/`,
#     `studio/`), each carrying its own version and its own `pyproject.toml`. `uv build` at the root
#     builds ONLY the root package — verified: it emits exactly `ctx_distillery-<v>.tar.gz` and
#     `ctx_distillery-<v>-py3-none-any.whl`, and neither member. So `dist/*` is safe to upload
#     wholesale. If a member is ever meant to publish too, it needs its own Trusted Publisher and
#     its own job; do not reach for `uv build --all-packages` here.
#
# Supply-chain: the two third-party actions are SHA-pinned — setup-uv, and (highest blast radius, it
# uploads to PyPI) pypi-publish. Bump a SHA and its trailing version comment together. GitHub-owned
# checkout/*-artifact stay on major tags. setup-uv's pin matches `ci.yml`'s; keep them in step.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Refuse a tag that disagrees with the package version
        run: |
          tag='${{ github.event.release.tag_name }}'
          version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "v$version" ]; then
            echo "::error::release tag '$tag' does not match pyproject version '$version' (expected 'v$version'). A PyPI version can never be reused — fix the tag or the version before publishing."
            exit 1
          fi
          echo "tag '$tag' matches pyproject version '$version'"
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Fork guard. `release: published` is inherited by every fork, so a fork cutting its own release
    # would fire this job and ask PyPI to publish `ctx-distillery` over OIDC. The Trusted Publisher
    # binding (owner+repo+workflow+environment) would reject it, but that is a rejected publish
    # attempt against OUR project, plus a probe surface and a confusing red run in someone else's
    # repo. `build` above is deliberately NOT guarded — it only builds an artifact, and a fork
    # verifying its own build (and its own tag/version agreement) is fine.
    if: github.repository == 'qazbnm456/ctx-distillery'
    environment: pypi
    permissions:
      id-token: write          # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
