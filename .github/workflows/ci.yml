name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest

  eval-test:
    name: eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Eval member tests
        # FIXED per adversarial review: `--package` only selects which workspace member's
        # ENVIRONMENT to use — it does not change pytest's cwd or which pyproject.toml's
        # `testpaths` gets resolved, so the original invocation silently re-ran the ROOT
        # package's suite three times (once per Python version) and never executed a single
        # test under eval/tests/, including the one-way-boundary test that is supposed to gate
        # the whole eval-member invariant. `--directory eval` makes pytest resolve eval's own
        # pyproject.toml and testpaths, verified against a real uv binary before landing this.
        # SECOND fix, found the same way while verifying the Studio pass's mirrored studio-test
        # job against a real `uv` binary: `--directory`+`--package` alone re-resolve the shared
        # workspace venv scoped to ONLY ctx-distillery-eval's own `dependencies` — `pytest` lives
        # in its `[project.optional-dependencies] dev`, not `dependencies`, so this job has been
        # failing with "No module named pytest" since it landed. `--extra dev` installs it.
        run: uv run --python ${{ matrix.python-version }} --directory eval --package ctx-distillery-eval --extra dev python -m pytest

  studio-test:
    name: studio (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Studio member tests
        # Mirrors eval-test's own fix: `--package` alone only selects which workspace member's
        # ENVIRONMENT to use, not pytest's cwd/`testpaths` resolution — `--directory studio` makes
        # pytest resolve studio's own pyproject.toml and testpaths. `--extra dev` installs
        # `pytest`/`httpx` (they live in ctx-distillery-studio's `[project.optional-dependencies]
        # dev`, not its `dependencies`) — omitting it reproduces the SAME "No module named pytest"
        # bug this pass found (and fixed) in the sibling eval-test job above. Both verified
        # end-to-end against a real `uv` binary before landing this, per the implementation plan's
        # own warning about the Phase-1 `--package`-alone bug.
        run: uv run --python ${{ matrix.python-version }} --directory studio --package ctx-distillery-studio --extra dev python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Lint
        run: uvx ruff check .
