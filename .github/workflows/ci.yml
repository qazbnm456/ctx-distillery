name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest

  eval-test:
    name: eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Eval member tests
        # FIXED per adversarial review: `--package` only selects which workspace member's
        # ENVIRONMENT to use — it does not change pytest's cwd or which pyproject.toml's
        # `testpaths` gets resolved, so the original invocation silently re-ran the ROOT
        # package's suite three times (once per Python version) and never executed a single
        # test under eval/tests/, including the one-way-boundary test that is supposed to gate
        # the whole eval-member invariant. `--directory eval` makes pytest resolve eval's own
        # pyproject.toml and testpaths, verified against a real uv binary before landing this.
        # `--extra dev` added for explicitness — CORRECTED per adversarial review, this is NOT a
        # bug fix. This is a uv WORKSPACE: one shared venv across all members, and the ROOT
        # pyproject.toml's [dependency-groups] dev = ["pytest>=8.0"] already installs pytest into
        # that shared venv on every `uv sync`, regardless of which member `--package` scopes a
        # given `uv run` to. So omitting `--extra dev` here does NOT reproduce "No module named
        # pytest" — verified against a real `uv` binary, from a fresh `.venv`, before adding this.
        # `--extra dev` is added anyway because it makes this job self-contained (correct even if
        # the root's dev group ever changed), not because anything here was broken.
        run: uv run --python ${{ matrix.python-version }} --directory eval --package ctx-distillery-eval --extra dev python -m pytest

  studio-test:
    name: studio (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Studio member tests
        # Mirrors eval-test's own `--directory` fix: `--package` alone only selects which
        # workspace member's ENVIRONMENT to use, not pytest's cwd/`testpaths` resolution —
        # `--directory studio` makes pytest resolve studio's own pyproject.toml and testpaths.
        # `--extra dev` is added for the SAME explicitness reason as eval-test's (see its comment
        # above) — this is a shared-venv uv workspace, so the root's own dev group already
        # provides pytest regardless; not a bug fix. Verified end-to-end against a real `uv`
        # binary before landing this.
        run: uv run --python ${{ matrix.python-version }} --directory studio --package ctx-distillery-studio --extra dev python -m pytest

  studio-static:
    name: studio static contracts (node)
    runs-on: ubuntu-latest
    # DELIBERATELY ITS OWN JOB, diverging from all three sibling repos, which append this as a STEP
    # to their single studio job. Theirs is one job; ours (`studio-test` above) is a 3-version Python
    # matrix, so a step there would run these byte-identical assertions THREE times. They read
    # `static/style.css` and `static/app.js` as TEXT — there is no Python in them at all, so nothing
    # about the result can vary by interpreter version, and two of the three runs would be pure
    # waste. A separate job also skips `uv sync` entirely (checkout + node, seconds) and names the
    # failure precisely in the CI UI instead of hiding a CSS regression inside "studio (py3.12)".
    # This matches how this repo already splits `test` / `eval-test` / `studio-test` / `lint` into
    # separate jobs where the siblings use steps in one.
    steps:
      - uses: actions/checkout@v4
      # No setup-node: the ubuntu runner ships node, and these tests are plain CommonJS with
      # `require("assert")` — no npm, no package.json, no node_modules anywhere in this repo.
      - name: Studio frontend static contracts
        # toolscout's `nullglob` form, NOT the other two siblings' unguarded loop: with no
        # `*.test.js` present, `for f in studio/tests/*.test.js` runs `node 'studio/tests/*.test.js'`
        # literally and fails module-not-found. GitHub's default shell is `bash -e {0}`, non-POSIX,
        # so `shopt` works as written.
        run: |
          shopt -s nullglob
          files=(studio/tests/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no frontend tests"; exit 0; fi
          for f in "${files[@]}"; do echo "▸ $f"; node "$f"; done

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Lint
        run: uvx ruff check .
