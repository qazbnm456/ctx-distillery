name: Install check

# Does this project's PUBLISHED front door still work? Every other job here runs `uv sync`, which
# reads `uv.lock` — so anything that breaks only OUTSIDE the lockfile is invisible to CI and reaches
# a user first. That is not hypothetical: it happened twice in one day.
#
#   * `rlm-kit` was renamed upstream to `rlm-harness`. `make check` stayed green the whole time
#     because the lockfile pinned the old commit, while the `uv tool install` command published in
#     `README.md` and inside the shipped skill was dead for everyone else.
#   * `litellm` (transitive, via `dspy`) stopped shipping a macOS wheel at 1.95+, so a source build
#     needs Rust and dies in `maturin`. Every job here runs on ubuntu, so this class is structurally
#     invisible.
#
# Both were found by a human happening to run an install by hand. This job is that habit, on a timer.
#
# **It installs the RELEASED artifact from PyPI, not this checkout.** That is deliberate: the
# question is "is the command we tell strangers to run working right now", and the answer depends on
# the whole dependency world, not on `main`. The corollary is worth knowing — a break introduced in
# `main` is not visible here until it is released.
#
# **Each platform runs exactly the command `README.md` gives for it**, macOS constraint included.
# Testing an idealized command instead would either go permanently red (the macOS wheel gap is not
# ours to fix and is documented rather than worked around) or test a promise nobody was made. When
# the constraint is no longer needed, dropping it here and staying green is the signal that upstream
# fixed it.
#
# Scheduled rather than a PR gate: the failure mode is "the world moved", not "this PR broke it", so
# paying network and wall-clock on every PR would buy nothing. `workflow_dispatch` is there for the
# one time it matters on demand.
#
# **`workflow_call` is the third trigger, and it answers a different question.** `release.yml` calls
# this after its publish job, because "the artifact we just shipped does not install" is the failure
# with the shortest fuse and the largest blast radius — and it is exactly the window the scheduled
# run cannot close, since this workflow tests the RELEASED artifact and a break lands the moment it
# is released. Two things make the release path work that the scheduled path does not need:
#
#   * **It must NOT be a second `on: release: published`.** That is the same event `release.yml`
#     itself keys on, so a separate workflow listening to it starts while the upload is still in
#     flight and fails against an index that does not have the version yet. `needs: publish` in the
#     caller is what orders it.
#   * **`expect-version` closes the false-GREEN.** PyPI's CDN lags, so an install right after a
#     publish can quietly resolve the PREVIOUS version and pass — testing the wrong artifact and
#     reporting success. With the input set, the step retries until the index actually serves that
#     version and fails only after giving up. A job that goes red on ordinary CDN lag teaches people
#     to ignore it, which costs more than the gap it closes.
#
# The verification is informational, not a gate: a PyPI version can never be reused, so a red run
# here means "go fix it forward", never "the release was rolled back".
#
# **A red here DOES conclude the whole Release run as failed, and that is chosen rather than
# overlooked.** rlm-harness's reviewer raised it as a contradiction with the informational framing
# and suggested `continue-on-error`. Half right: the mechanism is real, but `continue-on-error`
# concludes the run `success` and notifies nobody, which trades a misreadable signal for no signal —
# strictly worse for a job whose entire purpose is telling you the front door is broken. And the red
# is not actually a lie: the release DID produce an artifact that does not install.
#
# What was wrong was that the failure said nothing about what to do, so the person who clicked into
# it had to read this file to learn there is no rollback. The error annotation now carries that,
# which addresses the misreading at the moment it would happen instead of hoping a comment reaches
# someone first.

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays, 06:17 UTC. Off the hour on purpose: scheduled runs pile up
                                # at :00 across all of GitHub and get delayed.
  workflow_dispatch:
  workflow_call:
    inputs:
      expect-version:
        description: >-
          Wait until the index serves exactly this version before checking it. Empty (the scheduled
          and manual paths) means "whatever is current".
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # A macOS-only break is the interesting case; do not let it hide the
                                # linux result, or vice versa.
      matrix:
        include:
          - os: ubuntu-latest
            spec: '"ctx-distillery[cli]"'
          - os: macos-latest
            # The macOS caveat README.md documents. See this file's header.
            spec: '--with "litellm<1.95" "ctx-distillery[cli]"'
    steps:
      - uses: actions/checkout@v4         # for examples/demo-run.jsonl only, never for the install
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install the published package the way README.md says to
        # `--no-cache` on every attempt: uv would otherwise answer a retry from the index cache it
        # populated on the attempt that was too early, so the wait would never observe the new
        # version. Without `expect-version` this is one attempt and exits immediately.
        run: |
          expected="${{ inputs.expect-version }}"
          for attempt in $(seq 1 8); do
            if uv tool install --force --no-cache ${{ matrix.spec }}; then
              got="$(ctx-distillery --version | awk '{print $2}')"
              if [ -z "$expected" ] || [ "$got" = "$expected" ]; then
                # Report the ATTEMPT, not just the outcome, and raise a notice when it was not the
                # first. "Has this retry loop ever actually done anything?" then has an answer in CI
                # history that anyone can read, instead of resting on whether the person holding the
                # delete key knows why the loop is there. Insurance nobody has seen pay out is
                # exactly what a well-meaning tidy-up removes.
                echo "installed $got on attempt $attempt/8"
                if [ "$attempt" -gt 1 ]; then
                  echo "::notice::the index lagged: $expected only became installable on attempt $attempt of 8"
                fi
                exit 0
              fi
              echo "index still serving $got, waiting for $expected (attempt $attempt/8)"
            else
              echo "install failed, retrying (attempt $attempt/8)"
            fi
            sleep 20
          done
          if [ -n "$expected" ]; then
            # The release path. Whoever clicks into this red must not have to read this file to
            # learn there is nothing to undo — the failure itself has to say so, because the
            # instinct on a red release run is to look for a rollback that cannot exist.
            echo "::error::$expected did not become installable after 8 attempts. The publish ALREADY SUCCEEDED and a PyPI version can never be reused, so there is nothing to roll back and re-running this workflow will not help. Fix forward: cut the next patch version. This job is informational; the release itself is done."
          else
            echo "::error::gave up waiting for a working install after 8 attempts"
          fi
          exit 1
      - name: Both console scripts exist and run
        run: |
          ctx-distillery --version
          ctx-distillery-apply --version
      - name: The shipped example still renders a real plan
        # Not just "it imports": this is the second command README.md gives, and the shipped skill's
        # default path. `show` is fully offline, so it needs no credentials, no model and no sandbox.
        run: |
          output="$(ctx-distillery show examples/demo-run.jsonl)"
          echo "$output"
          case "$output" in
            *promote_to_memory*) ;;
            *) echo "::error::the shipped example no longer renders a promotion"; exit 1 ;;
          esac
