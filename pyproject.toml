[project]
name = "ctx-distillery"
version = "0.1.0"
description = "RLM-driven distillation planner for AI coding-agent session transcripts + persistent memory stores — proposes, never applies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = [
    "rlm",
    "rlm-kit",
    "memory",
    "distillation",
    "claude-code",
    "agent",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rlm-kit",
    "pydantic>=2.9",
    # Memory/skill frontmatter is real YAML with a NESTED `metadata.type` key; rlm_kit.skills's own
    # reader only handles flat `key: value` lines, so `ctx_distillery/frontmatter.py` parses it here.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only `ctx-distillery distill` needs a model client — it builds the `chat_fn` the two drafting
# tools call (`config.make_chat_fn`, which imports `openai` inside the closure). `show` and the
# whole `ctx-distillery-apply` path are fully offline, so a library-only install stays lean.
cli = ["openai>=1.0"]

[project.scripts]
ctx-distillery = "ctx_distillery.cli:main"
# The human-gated writer gets its OWN entry point, hosted in `apply.py` itself. A shared CLI module
# importing both `run_distillation` and `apply_plan` would turn
# `tests/test_no_write_capability.py::test_apply_is_unreachable_from_the_planner_path` red, and that
# test is the guard that makes `apply.py`'s mutation-scan exemption safe (CLAUDE.md invariant 8).
ctx-distillery-apply = "ctx_distillery.apply:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctx_distillery"]

[tool.ruff]
line-length = 110
target-version = "py311"

# rlm-kit is public but not on PyPI yet, so it comes in via a commit-pinned git source
# rather than a normal PyPI dependency; uv.lock pins the exact commit. Never `pip install`
# it directly. For local co-development against an in-progress rlm-kit checkout, overlay
# an editable install on top: `uv pip install -e ../rlm-kit` (see CLAUDE.md).
[tool.uv.sources]
rlm-kit = { git = "https://github.com/qazbnm456/rlm-kit.git", branch = "main" }

[tool.uv.workspace]
members = ["eval", "studio"]
